appId: com.cleanshell.browser
productName: Clean Surf
directories:
  output: dist
files:
  - out/**/*
mac:
  target:
    - dmg
  identity: null        # null = ad-hoc sign with "-" (no certificate needed)
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
dmg:
  title: Clean Surf
